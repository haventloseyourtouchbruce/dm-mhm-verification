<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Matching speed and storage: selected implementations</title>
<desc id="desc">Same 256-peak, 128-query, harmonics 2 through 4 workload. DM-MHM Standard: 2392 bytes and 1.183 microseconds. Automatic: 2392 bytes and 1.989 microseconds. Intel IPP adapter: 8632 bytes and 28.466 microseconds. KFR adapter: 4536 bytes and 58.254 microseconds. Matching time uses a logarithmic scale; lower and left are better.</desc>
