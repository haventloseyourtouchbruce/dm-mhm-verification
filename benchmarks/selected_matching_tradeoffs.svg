<text x="55" y="620" font-size="14">Recorded medians, case B060. Storage excludes output, allocator overhead and temporary stack space.</text>
<text x="55" y="642" font-size="14">IPP and KFR are exact-rule adapters. Selected points only; no global Pareto-optimality claim.</text>
