<text x="570" y="584" text-anchor="middle" font-size="20">Storage (KiB)</text>
<text transform="translate(35,310) rotate(-90)" text-anchor="middle" font-size="20">Batch time (µs, log scale)</text>
<circle cx="158.91" cy="499.86" r="9" fill="#008c88" stroke="white" stroke-width="2"/>
<text x="176.91" y="479.86" text-anchor="start" font-size="19" font-weight="700">DM-MHM Standard</text>
<text x="176.91" y="501.86" text-anchor="start" font-size="16">1.183 µs · 2,392 B</text>
<circle cx="158.91" cy="453.03" r="9" fill="#4987b0" stroke="white" stroke-width="2"/>
